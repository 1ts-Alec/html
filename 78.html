   <script>
(async function(){
  const RAW='https://raw.githubusercontent.com/1ts-Alec/BurritoBison/847c40b3aeee020afd4ffffacb65e36404e5a9de/';
  const cfg=await (await fetch('https://cdn.jsdelivr.net/gh/1ts-Alec/BurritoBison@847c40b3aeee020afd4ffffacb65e36404e5a9de/burrito-bison-ll.json')).json();
  for (const k of Object.keys(cfg)) {
    if (typeof cfg[k]==='string' && /\.(unityweb|data|wasm|jsgz)(\?|$)/i.test(cfg[k]) && !/^https?:/i.test(cfg[k])) cfg[k]=RAW+cfg[k];
  }
  const u=URL.createObjectURL(new Blob([JSON.stringify(cfg)],{type:'application/json'}));
  window.gameInstance = UnityLoader.instantiate("gameContainer", u, {onProgress: UnityProgress,Module:{onRuntimeInitialized: function() {UnityProgress(gameInstance, "complete")}}});
})();
