<script src="https://cdn.jsdelivr.net/gh/1ts-Alec/Tanuki-Sunset@a5b13b1279016c9bd123f06a4886b5987fa06dc5/TemplateData/UnityProgress.js"></script>
<script src="https://cdn.jsdelivr.net/gh/1ts-Alec/Tanuki-Sunset@a5b13b1279016c9bd123f06a4886b5987fa06dc5/Build/UnityLoader.js"></script>
<script>
(async function(){
  const RAW='https://raw.githubusercontent.com/1ts-Alec/Tanuki-Sunset/a5b13b1279016c9bd123f06a4886b5987fa06dc5/Build/';
  const cfg=await (await fetch('https://cdn.jsdelivr.net/gh/1ts-Alec/Tanuki-Sunset@a5b13b1279016c9bd123f06a4886b5987fa06dc5/Build/WebGL.json')).json();
  for (const k of Object.keys(cfg)) {
    if (typeof cfg[k]==='string' && /\.(unityweb|data|wasm|jsgz)(\?|$)/i.test(cfg[k]) && !/^https?:/i.test(cfg[k])) cfg[k]=RAW+cfg[k];
  }
  const u=URL.createObjectURL(new Blob([JSON.stringify(cfg)],{type:'application/json'}));
  window.gameInstance = UnityLoader.instantiate("gameContainer", u, {
        onProgress: UnityProgress,
        Module: {
            onRuntimeInitialized: function () {
                UnityProgress(gameInstance, "complete")
            }
        }
    });
})();
</script>

<div class="webgl-content">
    <div id="gameContainer" style="width: 100vw; height: 100vh"></div>
</div>
