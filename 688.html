
<!-- Ultimate Game Stash file-->
<!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->

<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/1ts-Alec/UGS@bc13cc7651ca3e238d734ba1e37964c3b8607071/SWFs/peggle/">
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Peggle</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: black;
      overflow: hidden; height: 100%; width: 100%;
    }
    #flash-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; background: black;
    }
    ruffle-player {
      width: 100%; height: 100%;
      background: black; display: block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <div id="flash-container"></div>
  <script>
    const SWF = "peggle.swf";
    window.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("flash-container");
      const ruffle = window.RufflePlayer?.newest() || window.RufflePlayer?.createPlayer();
      if (ruffle && container) {
        const player = ruffle.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        player.style.background = "black";
        container.appendChild(player);
        player.load(SWF);
      } else if (container) {
        container.textContent = "Ruffle failed to load.";
      }
    });
  </script>
</body>
</html>
