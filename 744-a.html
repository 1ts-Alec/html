  <script>
    var canvas = document.getElementById("unity-canvas");
    var container = document.getElementById("gameContainer");
    var loadingBar = document.getElementById("loadingBar");

    var buildUrl = "Build";
    var config = {
      dataUrl:         buildUrl + "/tung-sahur-horror-v25051505.data.unityweb",
      frameworkUrl:    buildUrl + "/tung-sahur-horror-v25051505.framework.js.unityweb",
      codeUrl:         buildUrl + "/tung-sahur-horror-v25051505.wasm.unityweb",
      streamingAssetsUrl: new URL("StreamingAssets", document.baseURI).href,
      companyName: "azgames.io",
      productName: "Tung Sahur Horror",
      productVersion: "25051505",
      pubId: "",
      gameId: "tung-sahur-horror",
      enableMoreGame: "yes",
      enablePromotion: true,
      eventLog: false
    };

    function onResize() {
      var w = window.innerWidth;
      var h = window.innerHeight;
      var r = 540 / 960;
      if (w * r > h) w = Math.ceil(h / r);
      h = Math.floor(w * r);
      container.style.width  = canvas.style.width  = w + "px";
      container.style.height = canvas.style.height = h + "px";
      container.style.top  = Math.floor((window.innerHeight - h) / 2) + "px";
      container.style.left = Math.floor((window.innerWidth  - w) / 2) + "px";
    }
    onResize();
    window.addEventListener("resize", onResize);

    var script = document.createElement("script");
    script.src = buildUrl + "/tung-sahur-horror-v25051505.loader.js";
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        document.getElementById("pct").innerText = Math.round(progress * 100) + "%";
      }).then(function(instance) {
        window.unityInstance = instance;
        setTimeout(function() {
          loadingBar.style.display = "none";
          container.style.display = "block";
          window.focus();
        }, 2000);
      }).catch(function(msg) {
        alert(msg);
      });
    };
    document.body.appendChild(script);
  </script>
