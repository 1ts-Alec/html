<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/1ts-Alec/UGS-Assets@734488f3e2a965c6a87fce24eac54623757f017f/rolling-sky/">
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Unity WebGL Player | Rolling Sky</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #gameContainer {
      width: 100vw;
      height: 100vh;
      display: block;
      margin: 0 auto;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
    #loading-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font: 16px/1.4 sans-serif;
      z-index: 10;
      pointer-events: none;
    }
  </style>
  <script src="Build/UnityLoader.js"></script>
  <script>
    function mergeFiles(fileParts) {
      return new Promise((resolve, reject) => {
        var buffers = [];
        function fetchPart(i) {
          if (i >= fileParts.length) {
            resolve(URL.createObjectURL(new Blob(buffers)));
            return;
          }
          fetch(fileParts[i])
            .then(function(r) {
              if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + fileParts[i]);
              return r.arrayBuffer();
            })
            .then(function(data) {
              buffers.push(data);
              fetchPart(i + 1);
            })
            .catch(reject);
        }
        fetchPart(0);
      });
    }

    function getParts(file, start, end) {
      var arr = [];
      for (var i = start; i <= end; i++) arr.push(file + '.part' + i);
      return arr;
    }

    function resizeUnityContainer() {
      var container = document.getElementById('gameContainer');
      if (!container) return;
      container.style.width = window.innerWidth + 'px';
      container.style.height = window.innerHeight + 'px';
    }

    window.addEventListener('resize', resizeUnityContainer);
    window.addEventListener('orientationchange', resizeUnityContainer);

    function UnityProgress(gameInstance, progress) {
      try {
        if (progress === 'complete') return;
        var pct = 0;
        if (typeof progress === 'number') pct = progress;
        else if (progress && progress.loaded && progress.total) pct = progress.loaded / progress.total;
        var txt = document.getElementById('loading-text');
        if (txt) txt.textContent = 'Loading... ' + Math.round(pct * 100) + '%';
      } catch (e) {}
    }

    window.addEventListener('load', function () {
      resizeUnityContainer();
      fetch('Build/WebGL.json')
        .then(function(r) {
          if (!r.ok) throw new Error('WebGL.json HTTP ' + r.status);
          return r.json();
        })
        .then(function(config) {
          return Promise.all([
            mergeFiles(getParts('Build/WebGL.data.unityweb', 1, 1)),
            mergeFiles(getParts('Build/WebGL.asm.code.unityweb', 1, 2)),
            mergeFiles(getParts('Build/WebGL.asm.memory.unityweb', 1, 1)),
            mergeFiles(getParts('Build/WebGL.asm.framework.unityweb', 1, 1))
          ]).then(function(urls) {
            config.dataUrl = urls[0];
            config.asmCodeUrl = urls[1];
            config.asmMemoryUrl = urls[2];
            config.asmFrameworkUrl = urls[3];
            var blobUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], { type: 'application/json' }));
            window.gameInstance = UnityLoader.instantiate('gameContainer', blobUrl, {
              onProgress: UnityProgress,
              Module: {
                onRuntimeInitialized: function () {
                  resizeUnityContainer();
                  var loadingText = document.getElementById('loading-text');
                  if (loadingText) loadingText.remove();
                  UnityProgress(window.gameInstance, 'complete');
                }
              }
            });
          });
        })
        .catch(function(err) {
          console.error('Unity load failed:', err);
          var txt = document.getElementById('loading-text');
          if (txt) txt.textContent = 'Load failed: ' + err;
        });
    });
  </script>
</head>
<body>
  <div id="loading-text">Loading...</div>
  <div id="gameContainer"></div>
</body>
</html>
