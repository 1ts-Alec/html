<script>
(function() {
  var map = {
    'ParkingFury3D.asm.code.unityweb': 'https://raw.githubusercontent.com/1ts-Alec/bulbasaurchat.github.io/de2858a9fa7b7176cee2788842d4278686969811/games/parking-fury-3d-main/parking-fury-3d-main/Build/ParkingFury3D.asm.code.unityweb'
  };
  function rewrite(url) {
    if (typeof url !== 'string') return url;
    for (var k in map) {
      if (url.indexOf(k) !== -1) {
        var q = url.indexOf('?');
        return map[k] + (q >= 0 ? url.slice(q) : '');
      }
    }
    return url;
  }
  var xo = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url) {
    arguments[1] = rewrite(url);
    return xo.apply(this, arguments);
  };
  var ofetch = window.fetch;
  if (ofetch) {
    window.fetch = function(input, init) {
      if (typeof input === 'string') input = rewrite(input);
      else if (input && typeof input.url === 'string') input = new Request(rewrite(input.url), input);
      return ofetch.call(this, input, init);
    };
  }
})();
</script>
