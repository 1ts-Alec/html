        /* Убираем выделение по нажатию клавиш */

        canvas:focus {
            outline: none;
        }

        html,
        body {
            /* Убираем отступы */
            padding: 0;
            margin: 0;
            /* Отключаем скролл и лонгтап на IOS */
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
            /* Ставим высоту на 100% */
            height: 100%;
        }

<body>
<script type="text/javascript">
        function loadLib(url) {
            var script = document.createElement("script");
            script.async = false;
            script.src = url;
            document.body.appendChild(script);
            if (/laya\.core/.test(url)) {
                // Laya takes its base path from location, which ignores <base>; use the game folder instead.
                var fix = document.createElement("script");
                fix.async = false;
                fix.src = "data:text/javascript," + encodeURIComponent("Laya.Laya._getUrlPath = function () { return Laya.URL.getPath(document.baseURI); };");
                document.body.appendChild(fix);
            }
        }
    </script>
<script type="text/javascript" src="index.js"></script>
