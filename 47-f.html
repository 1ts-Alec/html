</head>

<body>
    <div id="dummy" style="position:fixed;right:0;bottom:0"></div>
    <div id="orientation"></div>
    <div id="content"></div>
    <script type="text/javascript">
        var gameName = 'vex-3.min.js';

        function addScript(src, buster, callback) {
            var s = document.createElement('script');
            s.setAttribute('src', src + '?v=' + buster);
            if (typeof callback === 'function') {
                s.onload = callback;
            }
            document.body.appendChild(s);
        }
        addScript('version.js', Date.now(), function() {
            addScript(gameName, version, function() {
                // The sponsor splash screen loads its Spine animations from fbrq.io, which no longer exists.
                // A Spine object whose files never loaded becomes an empty placeholder instead of crashing.
                function safeSpine(addSpine) {
                    return function () {
                        try { return addSpine.apply(this, arguments); } catch (e) {
                            var group = this.game.add.group();
                            return new Proxy(group, { get: function (t, k) { return k in t ? t[k] : function () { return this; }; } });
                        }
                    };
                }
                var current = safeSpine(Phaser.GameObjectFactory.prototype.spine);
                // The Spine plugin installs its factory when the game boots; wrap whatever it installs.
                Object.defineProperty(Phaser.GameObjectFactory.prototype, 'spine', {
                    configurable: true,
                    get: function () { return current; },
                    set: function (fn) { current = safeSpine(fn); }
                });
                var game = new Vex3.Game.getInstance();
                game.start();
            })
        })
    </script>


</body>

</html>
