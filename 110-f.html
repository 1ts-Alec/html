<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://raw.esm.sh/gh/1ts-Alec/assets@039e5125be8a9e20c732a0984241f3f19974f830/no-ads.js"></script>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
  <title>Toss the Turtle</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
    #c { position:absolute; inset:0; }
    ruffle-player { width:100%; height:100%; display:block; }
  </style>
  <script src="https://raw.esm.sh/gh/1ts-Alec/google@6565521a2ec6d3e485d4dcfcfe132e237aaaf9f3/ruffle.js"></script>
</head>
<body>
  <div id="c"></div>
  <script>
    (async () => {
      const SWF = "https://raw.esm.sh/gh/ShadowDevLabs/files@aeb371b7e88542fd5e61eeed9e967a446d84fe1b/tosstheturtle/tosstheturtle.swf";
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = Object.assign({}, window.RufflePlayer.config || {}, {
        autoplay: "on",
        unmuteOverlay: "hidden",
        letterbox: "on"
      });
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("c").appendChild(player);
      await player.load(SWF);
    })().catch(e => {
      document.body.insertAdjacentHTML("beforeend", "<pre style='color:#fff'>"+String(e)+"</pre>");
    });
  </script>
</body>
</html>
