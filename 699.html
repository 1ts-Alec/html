<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <base href="https://cdn.jsdelivr.net/gh/1ts-Alec/UGS-Assets@734488f3e2a965c6a87fce24eac54623757f017f/stickman-destruction/">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Stickman Destruction</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script>
    window.fileMergerConfig = {
      files: [
        { name: 'game.data', parts: 2 },
        { name: 'game.wasm.code', parts: 2 }
      ],
      basePath: 'Build/',
      debug: true
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/1ts-Alec/UGS-Assets@734488f3e2a965c6a87fce24eac54623757f017f/merge.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <style>body{overflow:hidden;margin:0} #gameContainer{width:100vw;height:100vh}</style>
  <script>
    // Defer instantiate until merges ready
    function startGame() {
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/game.json", {
        onProgress: UnityProgress
      });
      window.__unityReady = true;
    }
    function waitMerges() {
      var cfg = window.fileMergerConfig;
      if (!cfg || !cfg.files) return startGame();
      var names = cfg.files.map(f => f.name);
      var t = setInterval(function() {
        if (names.every(n => window.mergedFiles && window.mergedFiles[n])) {
          clearInterval(t);
          startGame();
        }
      }, 100);
    }
    window.addEventListener('DOMContentLoaded', waitMerges);
  </script>
</head>
<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>
</body>
</html>
