<script>
(function(){
  const Orig = window.Worker;
  window.Worker = function(scriptURL, options){
    try {
      const abs = new URL(scriptURL, document.baseURI || location.href);
      if (abs.origin === location.origin || String(scriptURL).startsWith('blob:')) {
        return new Orig(scriptURL, options);
      }
      const src = abs.href;
      const boot = `try{importScripts(${JSON.stringify(src)});}catch(e){console.error('worker importScripts',e);throw e;}`;
      const blob = new Blob([boot], {type:'application/javascript'});
      return new Orig(URL.createObjectURL(blob), options);
    } catch (e) {
      return new Orig(scriptURL, options);
    }
  };
  window.Worker.prototype = Orig.prototype;
})();
</script>
