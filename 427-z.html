        'js/plugins.js?fgjdfngjksdgnkdsjgn',
        'js/main.js?fgjdfngjksdgnkdsjgn'
        ];
        function load(src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src; s.async = false; s.onload = resolve; s.onerror = reject;
            document.head.appendChild(s);
          });
        }
        SPLIT_FILES_URL('https://raw.esm.sh/gh/1ts-Alec/web-port@4d6e597f759e4233429a830cf8ec3987acd7384b/omori-fixed/data.bundle.js').then(function (url) {
          return rest.reduce(function (p, src) { return p.then(function () { return load(src); }); }, load(url));
        }).then(function () {
          // main.js starts the game from window.onload, which may already have fired.
          if (document.readyState === 'complete' && typeof window.onload === 'function') window.onload();
        });

    <!-- gn math patch -->
    <script>
        // full screen the game ----------------------------------------------------------
        function applycanvasmode() {
            let w = 0;
            let h = 0;
            let maxW = window.innerWidth;
            let maxH = window.innerHeight;
            if ((maxW * 0.75) > maxH) {
                h = maxH;
                w = Math.floor((maxH / 3) * 4);
            } else {
                w = maxW;
                h = Math.floor((maxW / 4) * 3);
            }
            document.querySelector("#GameCanvas").style.width = w + "px";
            document.querySelector("#GameCanvas").style.height = h + "px";
            document.querySelector("#GameVideo").style.width = w + "px";
            document.querySelector("#GameVideo").style.height = h + "px";
            document.querySelector("#UpperCanvas").style.width = w + "px";
            document.querySelector("#UpperCanvas").style.height = h + "px";
        }
        setInterval(applycanvasmode, 100);

        // support mobile ----------------------------------------------------------------
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (!isMobile) {
                return;
            }
            let i = setInterval(function() {
                if (window.fullSetupComplete) {
                    let zoneStatic = document.createElement("div");
                    zoneStatic.style = "position: fixed; bottom: 0; left: 0; z-index: 9999; width: 500px; height: 500px;";
                    let internal = document.createElement("div");
                    internal.style = "position: relative; width: 100%; height: 100%;"
                    zoneStatic.appendChild(internal);
                    let joystick = nipplejs.create({
                        mode: 'semi',
                        zone: internal,
                        color: 'red',
                        catchDistance: 30
                    });
                    setTimeout(function() {
                        joystick.on("dir", function(e, data) {
                            let dirs = ["up", "down", "left", "right"];
                            for (let o of dirs) {
                                if (o !== data.direction.angle) {
                                    fakeInput.up(o);
                                } else {
                                    fakeInput.down(o);
                                }
                            }
                        });
                        joystick.on("end", function() {
                            let dirs = ["up", "down", "left", "right"];
                            for (let o of dirs) {
                                fakeInput.up(o);
                            }
                        });
                    }, 100);
                    document.body.appendChild(zoneStatic);
                    const createButton = (text, key, bottom, right, bgColor) => {
                        let button = document.createElement("div");
                        button.style = `
                    position: fixed; 
                    bottom: ${bottom}; 
                    right: ${right}; 
                    width: 10vw; 
                    height: 10vw; 
                    background: ${bgColor}; 
                    color: white; 
                    touch-action: none; 
                    z-index: 999999; 
                    display: flex; 
                    align-items: center; 
                    justify-content: center; 
                    font-family: sans-serif; 
                    font-size: 3vw;
                    border-radius: 50%;
                `;
                        button.innerText = text;
                        button.addEventListener("touchstart", function(e) {
                            e.preventDefault();
                            fakeInput.down(key);
                        });
                        button.addEventListener("touchend", function(e) {
                            e.preventDefault();
                            fakeInput.up(key);
                        });
                        document.body.appendChild(button);
                        return button;
                    };

                    createButton("OK", "ok", "5vw", "5vw", "#0f08");
                    createButton("ESC", "escape", "5vw", "15vw", "#f008");
                    createButton("TAG", "tag", "15vw", "15vw", "#00f8");
                    createButton("RUN", "shift", "15vw", "5vw", "#f0f8");
                    clearInterval(i);
                }
            }, 100);
        })();
    </script>
